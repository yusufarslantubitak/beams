services:
  dev:
    image: beams-dev:latest
    pull_policy: never
    ports:
      - "5173:5173"
      - "8006:8006"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  release:
    image: golang:1.25-alpine
    pull_policy: never
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CGO_ENABLED=0
      - GOOS=linux
      - GOARCH=amd64
      - GOCACHE=/tmp/.cache
    command: >
      sh -c "mkdir -p release && go build -ldflags='-s -w' -o release/geojson-map-app ."
